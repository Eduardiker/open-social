name: Validate Content Packs (JSON)

on:
  push:
    paths:
      - 'content_hub/**'
  pull_request:
    paths:
      - 'content_hub/**'
  workflow_dispatch:

jobs:
  validate:
    name: Validar sintaxis JSON de los packs
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🔍 Validar archivos JSON
        run: |
          python3 -c "
          import json, glob, sys
          files = glob.glob('content_hub/**/*.json', recursive=True)
          errors = 0
          for f in files:
              try:
                  with open(f, 'r', encoding='utf-8') as fp:
                      json.load(fp)
                  print(f'✅ Válido: {f}')
              except Exception as e:
                  print(f'❌ Error en {f}: {e}')
                  errors += 1
          if errors > 0:
              sys.exit(1)
          "
