name: Build & Release Android APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Open Social APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: ☕ Configurar Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🐦 Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: 🛠️ Regenerar plataforma Android oficial limpia
        run: |
          cd app
          rm -rf android
          flutter create --platforms=android --org com.opensocial .
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' android/app/src/main/AndroidManifest.xml
          flutter pub get

      - name: 🚀 Compilar APK Release
        run: |
          cd app
          flutter build apk --release --no-tree-shake-icons

      - name: 📤 Subir APK como artefacto de descarga
        uses: actions/upload-artifact@v4
        with:
          name: jaleo-party-apk
          path: app/build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: 🏷️ Publicar en GitHub Releases (si es etiqueta v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/app/outputs/flutter-apk/app-release.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
