name: open_social
description: "JALEO: Plataforma comunitaria abierta de party games y dinámicas de fiesta para grupos."
publish_to: 'none'
version: 1.3.0+4

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
    - assets/content/
    - assets/content/index.json
    - assets/webapp/index.html
    - assets/content/es/picolo_mode/classic.json
    - assets/content/es/picolo_mode/party.json
    - assets/content/es/picolo_mode/spicy.json
    - assets/content/es/picolo_mode/bar.json
    - assets/content/es/hot_bomb/categories.json
    - assets/content/es/penalties/penalties.json
    - assets/content/es/would_you_rather/classic.json
    - assets/content/es/couples/classic.json
    - assets/content/es/most_likely_to/classic.json
    - assets/content/es/never_have_i_ever/classic.json
    - assets/content/es/never_have_i_ever/party.json
    - assets/content/es/truth_or_dare/classic.json
    - assets/content/es/fake_it/classic.json
    - assets/content/es/wrong_answers_only/classic.json
    - assets/content/es/charades/movies.json
